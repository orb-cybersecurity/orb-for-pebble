# Light checks that fit GitHub's hosted runners.
name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    # The overlay must still match the upstream files it was written against.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: python3 apply.py --check

  upstream:
    # Open an issue when Core tags a release newer than the pinned one.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with Core's tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          message=$(python3 tools/upstream.py status)
          code=$?
          set -e
          echo "$message"
          [ "$code" -eq 0 ] && exit 0
          [ "$code" -ne 3 ] && exit "$code"
          title="Update to Core $(echo "$message" | sed -n 's/^Core has released \([^;]*\);.*/\1/p')"
          open=$(gh issue list --state open --limit 100 --json title \
            | python3 -c 'import json,sys; t=sys.argv[1]; print(any(i["title"]==t for i in json.load(sys.stdin)))' "$title")
          [ "$open" = True ] && exit 0
          gh issue create --title "$title" --body "$message Run \`python3 tools/upstream.py bump <tag>\` to start."
          echo "Opened issue: $title"
