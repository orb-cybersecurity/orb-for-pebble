MaintainerNotes: |-
  The repository holds no copy of Core's source. mobileapp/ is Core's repository as a
  submodule, pinned to a release tag, and apply.py turns it into Orb: it copies overlay/ over
  the checkout and makes a list of small edits, each asserting how often it matched, and checks
  every upstream file it replaces against a recorded hash. A Core change that needs a human
  look therefore fails the build instead of slipping through.

  Orb removes the code that needs Google services or a Core account rather than stubbing it, so
  no Firebase, Google or analytics library is in the build (tools/check_deps.sh checks the release
  dependencies).

  Speex, which decodes dictation audio from the watch, is built from source
  (third_party/kotlin-speex, the commit Core published) with NDK r28b, in place of Core's
  prebuilt AAR. scandelete removes that project's own build file, which Orb does not use, and
  its test recording.

  Cleartext web traffic is blocked for Orb, watchapps and their settings pages.
  The off-by-default LAN developer server uses an unencrypted local connection.
  Web connections trust system CAs only. Firmware offers refuse downgrades; an explicit
  hidden version pin can downgrade with manual installation only. Android backup
  copies whole databases (including notification history, network usage and plugin-action
  history), app settings including the Rebble sign-in, and all of files/pbw/ (store and
  sideloaded PBWs plus extracted PKJS) through encrypted backup services or device transfer.
  Files in cache/, including logs, and plugin encryption keys are excluded. Backups may
  exceed a service's quota. Recovery watches can install normal firmware regardless of the
  recovery version. Classic PebbleKit is removed; phone apps need PebbleKit 2.

